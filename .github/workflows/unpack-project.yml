name: Unpack Asateer Al Kora project

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Add files via upload') || contains(github.event.head_commit.message, 'Upload safe Asateer Al Kora project archive') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project archive
        run: |
          set -e
          ARCHIVE="asateer-al-kora-safe-v2.zip"
          test -f "$ARCHIVE"
          rm -rf /tmp/asateer-project
          mkdir -p /tmp/asateer-project
          unzip -q "$ARCHIVE" -d /tmp/asateer-project
          if test -f /tmp/asateer-project/project/app.json; then
            SOURCE_DIR=/tmp/asateer-project/project
          else
            SOURCE_DIR=/tmp/asateer-project
          fi
          test -f "$SOURCE_DIR/app.json"
          cp -R "$SOURCE_DIR/." .
          rm -rf /tmp/asateer-project "$ARCHIVE"

      - name: Commit extracted project
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted files to commit"
            exit 0
          fi
          git commit -m "Extract Asateer Al Kora project files"
          git push
